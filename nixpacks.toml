[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_22", "python3"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs",
  "chmod -R 775 bootstrap/cache storage || true",
  "rm -rf bootstrap/cache/*.php",
  "php artisan package:discover --ansi || true",
  "npm ci --include=optional || npm install --include=optional"
]

[phases.build]
cmds = [
  "mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs && chmod -R 775 bootstrap/cache storage || true",
  "npm run build",
  "php artisan optimize:clear --ansi || true",
  "php artisan config:clear --ansi || true",
  "php artisan route:clear --ansi || true",
  "php artisan view:clear --ansi || true",
  "php artisan package:discover --ansi || true"
]

[start]
cmd = "sh -c \"mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs && chmod -R 775 bootstrap/cache storage || true; php artisan migrate --force && php artisan reverb:start --host=0.0.0.0 --port=8080 & exec php artisan serve --host=0.0.0.0 --port=$PORT\""

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app"
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"
